plugins {
    id 'com.android.application'
}

def rawTrustedCert = System.getenv('TRAILNOTE_TRUSTED_CERT_SHA256') ?: ''
def trustedCertSha256 = rawTrustedCert.replaceAll('[^0-9A-Fa-f]', '').toLowerCase()
def hsmSigningBoundary = (System.getenv('TRAILNOTE_HSM_SIGNING') ?: '') == '1'
def forbiddenFileKeystore = System.getenv('TRAILNOTE_SIGNING_STORE_FILE')

android {
    namespace 'com.rstlab.trailnote'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.rstlab.trailnote'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '4.0.0'
        buildConfigField 'String', 'DISTRIBUTION_TRUST_MODE', '"diagnostic"'
        buildConfigField 'String', 'TRUSTED_SIGNING_CERT_SHA256', '""'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            minifyEnabled false
            buildConfigField 'String', 'DISTRIBUTION_TRUST_MODE', '"diagnostic"'
            buildConfigField 'String', 'TRUSTED_SIGNING_CERT_SHA256', '""'
        }

        release {
            // Intentionally UNSIGNED in Gradle. Production signing is performed only by
            // a non-exportable HSM/PKCS#11 key on the dedicated signing runner.
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'DISTRIBUTION_TRUST_MODE', '"production"'
            buildConfigField 'String', 'TRUSTED_SIGNING_CERT_SHA256', "\"${trustedCertSha256}\""
        }

        hardened {
            initWith release
            applicationIdSuffix '.diagnostic'
            versionNameSuffix '-diagnostic'
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            buildConfigField 'String', 'DISTRIBUTION_TRUST_MODE', '"diagnostic"'
            buildConfigField 'String', 'TRUSTED_SIGNING_CERT_SHA256', '""'
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def verifyProductionTrustConfig = tasks.register('verifyProductionTrustConfig') {
    group = 'verification'
    description = 'Fail closed unless production is being prepared for a non-exportable HSM signing boundary.'
    doLast {
        if (!hsmSigningBoundary) {
            throw new GradleException('Production build refused: TRAILNOTE_HSM_SIGNING=1 is required; file-keystore production signing is disabled.')
        }
        if (forbiddenFileKeystore != null && !forbiddenFileKeystore.trim().isEmpty()) {
            throw new GradleException('Production build refused: exportable file keystore input is forbidden in HSM mode.')
        }
        if (trustedCertSha256.size() != 64) {
            throw new GradleException('Production build refused: TRAILNOTE_TRUSTED_CERT_SHA256 must be one SHA-256 fingerprint (64 hex chars).')
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn verifyProductionTrustConfig
}
