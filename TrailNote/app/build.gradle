plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rstlab.trailnote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rstlab.trailnote'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        hardened {
            initWith release
            debuggable false
            minifyEnabled true
            shrinkResources true
            // Installable CI artifact. Production distribution should replace this with a private release key.
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
