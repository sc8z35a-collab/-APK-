name: TrailNote Trusted Builder

on:
  workflow_call:
    inputs:
      production:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout immutable action revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Assert HSM production gate fails closed in ordinary CI
        working-directory: TrailNote
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/production-gate.log"
          if gradle :app:verifyProductionTrustConfig --no-daemon >"$LOG" 2>&1; then
            cat "$LOG"
            echo "ERROR: production HSM gate unexpectedly succeeded outside the signing environment." >&2
            exit 1
          fi
          grep -q "Production build refused" "$LOG"
          echo "PASS: production build is fail-closed without the HSM boundary."

      - name: Verify Adaptive Operations Core wiring
        shell: bash
        run: |
          set -euo pipefail
          CORE=TrailNote/app/src/main/java/com/rstlab/trailnote/workspace/adaptive/AdaptiveOperationsCore.java
          REPO=TrailNote/app/src/main/java/com/rstlab/trailnote/workspace/WorkspaceRepository.java
          test -s "$CORE"
          grep -q 'AdaptiveOperationsCore.apply' "$REPO"
          grep -q '#manual' "$CORE"
          grep -q 'restrictedAccess' "$CORE"

      - name: Verify v4 hardware-root and H4 hierarchy invariants
        shell: bash
        run: |
          set -euo pipefail
          CRYPTO=TrailNote/app/src/main/java/com/rstlab/trailnote/securityplant/CryptoPlant.java
          grep -q 'setIsStrongBoxBacked(true)' "$CRYPTO"
          grep -q 'HIERARCHY_PREFIX = "H4."' "$CRYPTO"
          grep -q 'DOMAIN_WRAP_PREFIX' "$CRYPTO"
          grep -q '"logs", "spots", "plans", "missions", "assets", "gear"' "$CRYPTO"
          grep -q 'cipher.init(Cipher.ENCRYPT_MODE, key);' "$CRYPTO"
          grep -q 'cipher.getIV()' "$CRYPTO"
          SECTION="$(sed -n '/private String encryptWithKeystore(SecretKey/,/private byte\[\] decryptWithKeystore/p' "$CRYPTO")"
          if printf '%s\n' "$SECTION" | grep -Fq 'new GCMParameterSpec'; then
            echo 'ERROR: Android Keystore encryption received a caller-provided IV.' >&2
            exit 1
          fi

      - name: Verify independent component integrity and guard mesh
        shell: bash
        run: |
          set -euo pipefail
          COMPONENT=TrailNote/app/src/main/java/com/rstlab/trailnote/securityplant/ComponentIntegrityPlant.java
          MESH=TrailNote/app/src/main/java/com/rstlab/trailnote/securityplant/GuardMesh.java
          PLANT=TrailNote/app/src/main/java/com/rstlab/trailnote/securityplant/SecurityContainerPlant.java
          test -s "$COMPONENT"
          test -s "$MESH"
          grep -q 'classes(\\d*)\\.dex' "$COMPONENT"
          grep -q 'AndroidManifest.xml' "$COMPONENT"
          grep -q 'resources.arsc' "$COMPONENT"
          grep -q 'cryptoGuard' "$MESH"
          grep -q 'runtimeGuard' "$MESH"
          grep -q 'distributionGuard' "$MESH"
          grep -q 'storageGuard' "$MESH"
          grep -q 'uiGuard' "$MESH"
          grep -q 'guardMesh.evaluate' "$PLANT"

      - name: Verify production signing has no exportable private-key fallback
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=TrailNote/security/sign-with-pkcs11-hsm.sh
          GRADLE=TrailNote/app/build.gradle
          test -s "$SCRIPT"
          grep -q -- '--ks-type PKCS11' "$SCRIPT"
          grep -q -- '--ks NONE' "$SCRIPT"
          grep -q 'exportable file-keystore signing is forbidden' "$SCRIPT"
          grep -q 'TRAILNOTE_HSM_SIGNING' "$GRADLE"
          if grep -q 'TRAILNOTE_SIGNING_KEYSTORE_B64' .github/workflows/trailnote-trusted-builder.yml; then
            echo 'ERROR: exportable production keystore secret was reintroduced.' >&2
            exit 1
          fi

      - name: Lint and build TrailNote v4 diagnostic APKs
        working-directory: TrailNote
        run: gradle :app:lintHardened :app:assembleHardened :app:assembleDebug --stacktrace --no-daemon

      - name: Ensure build did not mutate tracked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Build v4 diagnostic integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TrailNote/dist
          cp TrailNote/app/build/outputs/apk/hardened/app-hardened.apk TrailNote/dist/TrailNote-4.0.0-hardened-diagnostic.apk
          HASH="$(sha256sum TrailNote/dist/TrailNote-4.0.0-hardened-diagnostic.apk | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" 'TrailNote-4.0.0-hardened-diagnostic.apk' > TrailNote/dist/SHA256SUMS-diagnostic.txt
          printf '{"artifact":"TrailNote-4.0.0-hardened-diagnostic.apk","sha256":"%s","source_commit":"%s","workflow_run":"%s","trust_mode":"diagnostic","workspace_schema":3,"adaptive_engine":"1.0.0","crypto_format":"H4","hardware_root":"strongbox-first","component_integrity":"sealed","guard_mesh":5,"production_trusted":false}\n' \
            "$HASH" "$GITHUB_SHA" "$GITHUB_RUN_ID" > TrailNote/dist/diagnostic-trust.json

      - name: Generate Sigstore/GitHub provenance for diagnostic APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: TrailNote/dist/TrailNote-4.0.0-hardened-diagnostic.apk

      - name: Verify generated provenance immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify TrailNote/dist/TrailNote-4.0.0-hardened-diagnostic.apk --repo "$GITHUB_REPOSITORY"

      - name: Upload attested v4 diagnostic bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TrailNote-v4-hardware-root-guard-mesh-attested
          path: |
            TrailNote/dist/TrailNote-4.0.0-hardened-diagnostic.apk
            TrailNote/dist/SHA256SUMS-diagnostic.txt
            TrailNote/dist/diagnostic-trust.json
          if-no-files-found: error
          retention-days: 30

  production:
    if: ${{ inputs.production }}
    needs: diagnostic
    # A production private key must be non-exportable and reachable only from this
    # dedicated runner through its preconfigured PKCS#11 provider.
    runs-on: [self-hosted, linux, trailnote-hsm]
    timeout-minutes: 45
    environment: trailnote-production-hsm
    steps:
      - name: Checkout approved source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Validate non-exportable HSM signing boundary
        shell: bash
        env:
          TRUSTED_CERT: ${{ secrets.TRAILNOTE_TRUSTED_CERT_SHA256 }}
          HSM_ALIAS: ${{ secrets.TRAILNOTE_HSM_KEY_ALIAS }}
          HSM_PIN_SECRET: ${{ secrets.TRAILNOTE_HSM_PIN }}
        run: |
          set -euo pipefail
          test -n "$HSM_ALIAS"
          test -n "$HSM_PIN_SECRET"
          NORMALIZED="$(printf '%s' "$TRUSTED_CERT" | tr -cd '0-9A-Fa-f' | tr 'A-F' 'a-f')"
          test "${#NORMALIZED}" -eq 64
          echo "TRAILNOTE_HSM_SIGNING=1" >> "$GITHUB_ENV"
          echo "TRAILNOTE_TRUSTED_CERT_SHA256=$NORMALIZED" >> "$GITHUB_ENV"
          echo "HSM_KEY_ALIAS=$HSM_ALIAS" >> "$GITHUB_ENV"
          echo "HSM_PIN=$HSM_PIN_SECRET" >> "$GITHUB_ENV"

      - name: Build unsigned fail-closed v4 production APK
        working-directory: TrailNote
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Sign only inside PKCS11 HSM boundary
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=TrailNote/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$UNSIGNED"
          chmod 700 TrailNote/security/sign-with-pkcs11-hsm.sh
          mkdir -p TrailNote/dist
          TrailNote/security/sign-with-pkcs11-hsm.sh "$UNSIGNED" TrailNote/dist/TrailNote-4.0.0-production.apk

      - name: Build production trust manifest
        shell: bash
        run: |
          set -euo pipefail
          APK=TrailNote/dist/TrailNote-4.0.0-production.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          VERIFY_OUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          ACTUAL="$(printf '%s\n' "$VERIFY_OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -cd '0-9A-Fa-f' | tr 'A-F' 'a-f')"
          test "$ACTUAL" = "$TRAILNOTE_TRUSTED_CERT_SHA256"
          HASH="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$HASH" 'TrailNote-4.0.0-production.apk' > TrailNote/dist/SHA256SUMS-production.txt
          printf '{"artifact":"TrailNote-4.0.0-production.apk","sha256":"%s","signing_cert_sha256":"%s","source_commit":"%s","workflow_run":"%s","repository":"%s","trust_mode":"production","signing_backend":"non-exportable-pkcs11-hsm","crypto_format":"H4","hardware_root":"strongbox-first","component_integrity":"sealed","guard_mesh":5,"apk_signature_policy":"v2-v3"}\n' \
            "$HASH" "$ACTUAL" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > TrailNote/dist/production-trust.json

      - name: Ensure production build did not mutate tracked source
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Generate provenance for production APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: TrailNote/dist/TrailNote-4.0.0-production.apk

      - name: Generate provenance for production trust manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: TrailNote/dist/production-trust.json

      - name: Verify production provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify TrailNote/dist/TrailNote-4.0.0-production.apk --repo "$GITHUB_REPOSITORY"
          gh attestation verify TrailNote/dist/production-trust.json --repo "$GITHUB_REPOSITORY"

      - name: Upload production HSM trust bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TrailNote-v4-production-hsm-trust
          path: |
            TrailNote/dist/TrailNote-4.0.0-production.apk
            TrailNote/dist/SHA256SUMS-production.txt
            TrailNote/dist/production-trust.json
          if-no-files-found: error
          retention-days: 90

      - name: Clear HSM session secret from job environment
        if: ${{ always() }}
        shell: bash
        run: |
          unset HSM_PIN || true
