name: TrailNote Android Trust Pipeline

on:
  push:
    branches: ["trailnote-v1"]
    paths:
      - "TrailNote/**"
      - "DISTRIBUTION_TRUST_BOUNDARY.md"
      - "SECURITY_CONTAINER_PLANT.md"
      - ".github/workflows/trailnote-android.yml"
      - ".github/workflows/trailnote-trusted-builder.yml"
  workflow_dispatch:
    inputs:
      production:
        description: "Request gated production-signing job"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  trusted-build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/trailnote-trusted-builder.yml
    with:
      production: ${{ github.event_name == 'workflow_dispatch' && inputs.production }}
    secrets: inherit
