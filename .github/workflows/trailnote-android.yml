name: TrailNote Android CI

on:
  push:
    branches: ["trailnote-v1"]
    paths:
      - "TrailNote/**"
      - ".github/workflows/trailnote-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint and build hardened APK
        working-directory: TrailNote
        run: gradle :app:lintHardened :app:assembleHardened :app:assembleDebug --stacktrace

      - name: Upload hardened APK
        uses: actions/upload-artifact@v4
        with:
          name: TrailNote-v2-security-container-plant-hardened-apk
          path: TrailNote/app/build/outputs/apk/hardened/app-hardened.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug diagnostics APK
        uses: actions/upload-artifact@v4
        with:
          name: TrailNote-v2-debug-diagnostics-apk
          path: TrailNote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
